{% include base_path %}

<div class="page__footer-copyright" style="text-align: center; padding: 1rem 0;">
  <span>&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}</span>
  <span style="margin: 0 0.5rem;">&middot;</span>
  <span><i class="far fa-clock"></i> Last updated: {{ "now" | date: '%Y-%m-%d' }}</span>
  <span style="margin: 0 0.5rem;">&middot;</span>
  <span>Powered by <a href="http://jekyllrb.com" rel="nofollow">Jekyll</a> &amp; <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a></span>
  <span style="margin: 0 0.5rem;">&middot;</span>
  <span class="visitor-count" style="display: inline-flex; align-items: center; gap: 0.3em; padding: 0.2em 0.6em; background: #f8f9fa; border-radius: 12px; border: 1px solid #e9ecef; font-size: 0.82rem;">
    <i class="fas fa-eye"></i> <span id="visitor-count">—</span>
  </span>
</div>

<!-- Simple visitor counter using localStorage (no external dependency) -->
<script>
  (function() {
    try {
      var key = 'page_visits_' + window.location.hostname;
      var count = parseInt(localStorage.getItem(key) || '0', 10);
      // Increment once per session
      if (!sessionStorage.getItem('visited')) {
        count += 1;
        localStorage.setItem(key, count);
        sessionStorage.setItem('visited', '1');
      }
      var el = document.getElementById('visitor-count');
      if (el) el.textContent = count + ' visits';
    } catch(e) {}
  })();
</script>
